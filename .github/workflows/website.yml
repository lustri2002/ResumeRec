name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-site.py'
      - 'scripts/tests/test_build_site.py'
      - '.github/workflows/website.yml'
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the current website from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Test release selection and rendering
        run: python3 -m unittest discover -s scripts/tests -p 'test_build_site.py' -v
      - name: Read published releases, including betas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Build the static website
        run: python3 scripts/build-site.py --releases "$RUNNER_TEMP/releases.json" --output "$RUNNER_TEMP/website"
      - name: Upload the website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
